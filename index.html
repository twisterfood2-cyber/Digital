<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>وحدات ريسيل | Digital Real Estate</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23c9992e'/%3E%3Ctext x='50' y='68' font-family='Arial, sans-serif' font-size='55' font-weight='900' fill='%230f2942' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23c9992e'/%3E%3Ctext x='50' y='68' font-family='Arial, sans-serif' font-size='55' font-weight='900' fill='%230f2942' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f2942;
    --navy-dark: #0a1c2e;
    --gold: #c9992e;
    --gold-light: #f4e6c8;
    --bg: #f7f5f0;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1c2530;
    --muted: #6b7684;
    --whatsapp: #25d366;
    --whatsapp-dark: #1ea952;
    --success-bg: #e3f3e9; --success-fg: #1e7145;
    --warn-bg: #fbf1da; --warn-fg: #8a6200;
    --error-bg: #fbe6e6; --error-fg: #b3261e;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    direction: rtl;
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.6;
  }
  button, input, select { font-family: inherit; }

  /* ============ Header ============ */
  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: #fff;
    padding: 20px 20px 0;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .header-top {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand-badge {
    width: 88px; height: 88px;
    border-radius: 22px;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 40px; color: var(--navy);
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  .brand-text h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.3px;
  }
  .brand-text p {
    margin: 4px 0 0;
    font-size: 16px;
    font-weight: 600;
    color: var(--gold-light);
    opacity: 0.9;
  }
  .header-right-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-whatsapp {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--whatsapp);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    white-space: nowrap;
    transition: background 0.15s ease;
  }
  .header-whatsapp:hover { background: var(--whatsapp-dark); }

  /* ============ Hero ============ */
  .hero {
    max-width: 900px;
    margin: 0 auto;
    padding: 34px 20px 38px;
    text-align: center;
  }
  .hero h2 {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 900;
    margin: 0 0 14px;
    line-height: 1.4;
    letter-spacing: -0.3px;
  }
  .hero h2 .gold-part { color: var(--gold); }
  .hero-divider {
    width: 70px;
    height: 4px;
    background: var(--gold);
    border-radius: 999px;
    margin: 0 auto 16px;
  }
  .hero p {
    margin: 0 auto;
    max-width: 620px;
    color: var(--gold-light);
    font-size: 16px;
    opacity: 0.9;
  }
  .visitor-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    padding: 8px 18px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 999px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
  }
  .visitor-badge .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse 1.5s infinite;
  }
  .visitor-badge b { color: var(--gold); font-size: 16px; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ============ Filters ============ */
  .filters-wrap {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .filters {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    align-items: end;
  }
  .filter-field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 5px;
  }
  .filter-field select, .filter-field input {
    width: 100%;
    padding: 11px 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease;
  }
  .filter-field select:focus, .filter-field input:focus {
    border-color: var(--gold);
  }
  .filter-actions {
    display: flex;
    gap: 8px;
  }
  .btn {
    padding: 11px 20px;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--navy); color: #fff; flex: 1; }
  .btn-primary:hover { background: var(--navy-dark); }
  .btn-ghost { background: var(--bg); color: var(--muted); border: 2px solid var(--border); }
  .btn-ghost:hover { background: var(--border); }

  /* ============ Results ============ */
  .results-bar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 18px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-weight: 600;
    font-size: 15px;
  }

  .grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 20px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(15,41,66,0.12);
  }
  .card-img {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--bg) center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    position: relative;
  }
  .card-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--gold);
    color: var(--navy);
    font-weight: 800;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 999px;
  }
  .card-body {
    padding: 16px 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  /* ============ صف علوي: رقم الوحدة + شارة الحالة ============ */
  .unit-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .unit-id { font-size: 13px; color: var(--muted); font-weight: 700; }
  .status-badge {
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: 800;
    background: var(--success-bg);
    color: var(--success-fg);
  }
  .status-badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .status-badge.error { background: var(--error-bg); color: var(--error-fg); }

  .card-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--navy);
    margin: 0;
    text-align: right;
  }
  .card-sub {
    font-size: 14px;
    color: var(--text);
    font-weight: 700;
    margin: -6px 0 0;
    text-align: right;
  }
  .unit-added {
    font-size: 12.5px;
    color: var(--muted);
    text-align: right;
  }
  .card-price {
    font-size: 22px;
    font-weight: 900;
    color: var(--navy);
  }
  .card-price small {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }

  /* ============ صندوق الوضع المالي الحالي (أخضر) ============ */
  .resale-current-box {
    background: linear-gradient(135deg, #1e7145 0%, #164f31 100%);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .resale-box-title { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 10px; text-align: right; }
  .resale-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .resale-item { display: flex; flex-direction: column; gap: 3px; text-align: right; }
  .resale-label { font-size: 12px; color: rgba(255,255,255,0.75); }
  .resale-value { font-size: 16px; font-weight: 800; color: #fff; }
  .resale-item.highlight .resale-value { color: var(--gold-light); }

  /* ============ صندوق السعر (نيفي) ============ */
  .unit-price-box {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    border-radius: 12px;
    padding: 20px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .unit-price-box .final-price { font-size: 26px; font-weight: 900; color: #fff; }
  .unit-price-box .per-meter { font-size: 14px; font-weight: 700; color: var(--gold); margin-top: 6px; }

  /* ============ زرار "عرض التفاصيل الكاملة" القابل للطي ============ */
  .toggle-details-btn {
    width: 100%;
    background: var(--bg);
    color: var(--navy);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.15s ease;
  }
  .toggle-details-btn:hover { background: var(--gold-light); }
  .toggle-details-btn .chevron { transition: transform 0.2s ease; font-size: 12px; }
  .toggle-details-btn.open .chevron { transform: rotate(180deg); }

  /* ============ تفاصيل إضافية (مقدم / أقساط / تسليم / ملاحظات...) ============ */
  .unit-extra {
    display: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-size: 14.5px;
    line-height: 2;
    color: var(--text);
    text-align: right;
  }
  .unit-extra.open { display: block; }
  .unit-extra div { margin-bottom: 3px; }
  .unit-extra div:last-child { margin-bottom: 0; }
  .unit-extra b { color: var(--navy); font-weight: 800; }

  .card-specs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .spec-chip {
    background: var(--gold-light);
    color: var(--navy);
    font-size: 13px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 8px;
  }
  .card-footer {
    margin-top: auto;
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .action-row {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    gap: 6px;
  }
  .card-whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: var(--whatsapp);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 6px;
    border-radius: 9px;
    transition: background 0.15s ease;
    white-space: nowrap;
  }
  .card-whatsapp:hover { background: var(--whatsapp-dark); }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: var(--bg);
    color: var(--navy);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 4px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s ease;
    white-space: nowrap;
  }
  .icon-btn:hover { background: var(--gold-light); }

  .edit-btn-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--gold-light);
    color: var(--navy);
    border: 1px solid var(--gold);
    border-radius: 9px;
    padding: 10px;
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
    transition: background 0.15s ease;
  }
  .edit-btn-row:hover { background: var(--gold); color: #fff; }

  /* ============ States ============ */
  .state-box {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
  }
  .state-box .icon { font-size: 44px; margin-bottom: 12px; }
  .state-box h3 { color: var(--navy); font-size: 19px; margin: 0 0 6px; }
  .spinner {
    width: 34px; height: 34px;
    border: 4px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center;
    padding: 26px 20px 34px;
    color: var(--muted);
    font-size: 13.5px;
  }

  @media (max-width: 640px) {
    .header-top { flex-wrap: wrap; }
    .header-whatsapp span.full-text { display: none; }
    .brand-badge { width: 60px; height: 60px; font-size: 28px; border-radius: 16px; }
    .brand-text h1 { font-size: 21px; }
    .brand-text p { font-size: 13px; }
    .filters { grid-template-columns: repeat(2, 1fr); }
    .filter-actions { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand">
      <div class="brand-badge">D</div>
      <div class="brand-text">
        <h1>Resale Units</h1>
        <p>Digital Real Estate</p>
      </div>
    </div>
    <div class="header-right-group">
      <a class="header-whatsapp" id="headerWhatsapp" href="#" target="_blank" rel="noopener">
        <span>💬</span><span class="full-text">تواصل معانا</span>
      </a>
      <button type="button" id="adminLockBtn" title="دخول الأدمن" style="background:transparent;border:none;color:rgba(255,255,255,0.35);font-size:16px;cursor:pointer;padding:6px;">🔐</button>
    </div>
  </div>
  <div class="hero">
    <h2>وحدات ريسيل <span class="gold-part">خدمة مجانية بالكامل</span></h2>
    <div class="hero-divider"></div>
    <p>نساعدك تلاقي وحدتك بدون عمولات — تصفّح الوحدات المعروضة وتواصل مع صاحبها مباشرة.</p>
    <div class="visitor-badge"><span class="dot"></span> <span id="visitorCount">...</span> <span>زائر شاهدوا الموقع</span></div>
  </div>
</header>

<div class="filters-wrap">
  <div class="filters">
    <div class="filter-field">
      <label>المدينة</label>
      <select id="fCity"><option value="">الكل</option></select>
    </div>
    <div class="filter-field">
      <label>المنطقة</label>
      <select id="fDistrict"><option value="">الكل</option></select>
    </div>
    <div class="filter-field">
      <label>نوع العقار</label>
      <select id="fType"><option value="">الكل</option></select>
    </div>
    <div class="filter-field">
      <label>المطور</label>
      <select id="fDeveloper"><option value="">الكل</option></select>
    </div>
    <div class="filter-field">
      <label>أقل سعر</label>
      <input type="number" id="fMinPrice" placeholder="بدون حد أدنى">
    </div>
    <div class="filter-field">
      <label>أعلى سعر</label>
      <input type="number" id="fMaxPrice" placeholder="بدون حد أقصى">
    </div>
    <div class="filter-field">
      <label>بحث</label>
      <input type="text" id="fKeyword" placeholder="اسم مشروع، منطقة...">
    </div>
    <div class="filter-actions">
      <button class="btn btn-primary" id="applyFiltersBtn">بحث</button>
      <button class="btn btn-ghost" id="resetFiltersBtn">تفريغ</button>
    </div>
  </div>
</div>

<div class="results-bar">
  <span id="resultsCount">جاري تحميل الوحدات...</span>
</div>

<div id="content"></div>

<footer>
  خدمة عرض وحدات الريسيل من Digital Real Estate — مجانًا لوجه الله تعالى 🤍
</footer>

<script>
/* ============================================================
 * ⚠️ الإعداد الوحيد المطلوب: الصق رابط الـ Web App بتاع Apps Script هنا
 * (اللي بتاخده من Deploy → New deployment بعد ما تنشر Code.gs)
 * ============================================================ */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAbUsJH_44MWngzSeFMZ-OHg2hcIjZydb0VP3wHCIuw_FElZfmS7JsmGD3Km03hGkt7A/exec";

/* رقم الواتساب اللي هيتواصل عليه العميل مع المكتب */
const WHATSAPP_NUMBER = "201016908888"; // 01016908888 بصيغة دولية

let allFilterOptions = { cities: [], districts: [], propertyTypes: [], developers: [] };

function buildWhatsappLink(unit) {
  const project = unit["Project Name"] || "";
  const city = unit["City"] || "";
  const id = unit["Unit ID"] || "";
  const text = `السلام عليكم، أنا مهتم بالوحدة رقم ${id} في مشروع ${project} - ${city}. ممكن أعرف تفاصيل أكتر؟`;
  return "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text);
}

/**
 * مشاركة تفاصيل الوحدة عبر واتساب - من غير رقم محدد، عشان العميل
 * يختار هو يبعتها لمين (صديق، قريب، أي حد يهمه العرض)
 */
function buildShareLink(unit) {
  const lines = [
    `🏠 ${unit["Property Type"] || ""} - ${unit["Project Name"] || ""}`,
    `📍 ${unit["City"] || ""}${unit["Area/District"] ? " - " + unit["Area/District"] : ""}`,
    unit["Unit Area (sqm)"] ? `📐 ${unit["Unit Area (sqm)"]} م²` : "",
    `💰 ${formatPrice(unit["Price"])}`,
    "",
    "شاهد كل التفاصيل هنا:",
    window.location.href
  ].filter(Boolean);
  return "https://wa.me/?text=" + encodeURIComponent(lines.join("\n"));
}

/**
 * عرض وحدات مشابهة - بيملى الفلاتر (نفس المدينة ونوع العقار)
 * ويعمل بحث جديد على طول
 */
function showSimilarUnits(city, propertyType) {
  document.getElementById("fCity").value = city || "";
  document.getElementById("fType").value = propertyType || "";
  document.getElementById("fDeveloper").value = "";
  document.getElementById("fDistrict").value = "";
  document.getElementById("fKeyword").value = "";
  loadUnits();
  document.querySelector(".filters-wrap").scrollIntoView({ behavior: "smooth" });
}

function setHeaderWhatsapp() {
  const text = "السلام عليكم، حابب أعرف أكتر عن وحدات الريسيل المعروضة عندكم";
  document.getElementById("headerWhatsapp").href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text);
}

function formatPrice(n) {
  const num = Number(n);
  if (!num) return "السعر عند الطلب";
  return num.toLocaleString("en-US") + " جنيه";
}

function fmtNum(n) {
  const num = Number(n);
  if (!num && num !== 0) return "";
  return num.toLocaleString("en-US");
}

function buildResaleBoxHtml(unit) {
  const purchasePPM = Number(unit["Resale Price Per Meter At Purchase"]) || 0;
  const currentPPM = Number(unit["Resale Current Price Per Meter"]) || 0;
  const ppmDiff = (purchasePPM > 0 && currentPPM > 0) ? (currentPPM - purchasePPM) : null;

  const items = [];
  if (unit["Resale Paid Amount"]) items.push(`<div class="resale-item"><span class="resale-label">المدفوع حتى الآن</span><span class="resale-value">${fmtNum(unit["Resale Paid Amount"])} جنيه</span></div>`);
  if (unit["Resale Remaining Amount"]) items.push(`<div class="resale-item"><span class="resale-label">المتبقي على الوحدة</span><span class="resale-value">${fmtNum(unit["Resale Remaining Amount"])} جنيه</span></div>`);
  if (unit["Resale Over Price"]) items.push(`<div class="resale-item highlight"><span class="resale-label">الأوفر المطلوب</span><span class="resale-value">${unit["Resale Over Price"]}</span></div>`);
  if (unit["Resale Remaining Period"]) items.push(`<div class="resale-item"><span class="resale-label">الفترة المتبقية للسداد</span><span class="resale-value">${unit["Resale Remaining Period"]}</span></div>`);
  if (purchasePPM) items.push(`<div class="resale-item"><span class="resale-label">سعر المتر عند الشراء</span><span class="resale-value">${fmtNum(purchasePPM)} ج/م²</span></div>`);
  if (currentPPM) items.push(`<div class="resale-item"><span class="resale-label">سعر المتر الحالي بالشركة</span><span class="resale-value">${fmtNum(currentPPM)} ج/م²</span></div>`);
  if (ppmDiff !== null) items.push(`<div class="resale-item highlight"><span class="resale-label">فرق سعر المتر</span><span class="resale-value">${ppmDiff >= 0 ? "+" : ""}${fmtNum(ppmDiff)} ج/م²</span></div>`);

  if (items.length === 0) return "";
  return `
    <div class="resale-current-box">
      <div class="resale-box-title">💰 الوضع المالي الحالي</div>
      <div class="resale-row-grid">${items.join("")}</div>
    </div>`;
}

function buildExtraDetailsHtml(unit) {
  const rows = [];
  if (unit["Payment Method"]) rows.push(`<div><b>الدفع:</b> ${unit["Payment Method"]}${unit["Installment Years"] ? " " + unit["Installment Years"] + " سنوات" : ""}</div>`);
  if (unit["Down Payment"]) rows.push(`<div><b>المقدم:</b> (${unit["Down Payment"]}%) = ${fmtNum(unit["Down Payment Value"])} جنيه</div>`);
  if (unit["Payment Count"]) rows.push(`<div><b>الدفعات:</b> ${unit["Payment Count"]} دفعة × ${fmtNum(unit["Payment Amount Value"])} جنيه${unit["Payment Schedule"] ? " - " + unit["Payment Schedule"] : ""}</div>`);
  if (unit["Monthly Installment"]) rows.push(`<div><b>القسط الشهري التقريبي:</b> ${fmtNum(unit["Monthly Installment"])} جنيه/شهريًا</div>`);
  if (unit["View"]) rows.push(`<div><b>الفيو:</b> ${unit["View"]}</div>`);
  if (unit["Other Payment Plans"] === "نعم") rows.push(`<div><b>✅ متاح أنظمة سداد أخرى</b></div>`);
  if (unit["Delivery Date"]) rows.push(`<div><b>التسليم:</b> ${unit["Delivery Date"]}</div>`);
  if (unit["Resale Reason"]) rows.push(`<div><b>سبب البيع:</b> ${unit["Resale Reason"]}</div>`);
  if (unit["Notes"]) rows.push(`<div><b>ملاحظات:</b> ${unit["Notes"]}</div>`);

  if (rows.length === 0) return "";
  return rows.join("");
}

let cardCounter = 0;

function unitCardHtml(unit) {
  cardCounter++;
  const cardId = "extra-" + cardCounter;

  const images = String(unit["Images"] || "").split(",").map(s => s.trim()).filter(Boolean);
  const imgStyle = images.length ? `style="background-image:url('${images[0]}')"` : "";
  const status = unit["Status"] || "متاح";
  const statusClass = status === "محجوز" ? "warn" : (status === "تم البيع" ? "error" : "");

  const specs = [];
  if (unit["Unit Area (sqm)"]) specs.push("📐 " + unit["Unit Area (sqm)"] + " م²");
  if (unit["Rooms"]) specs.push("🛏 " + unit["Rooms"] + " غرف");
  if (unit["Bathrooms"]) specs.push("🚿 " + unit["Bathrooms"] + " حمام");
  if (unit["Floor"]) specs.push("🏢 دور " + unit["Floor"]);
  if (unit["Finishing"]) specs.push("🎨 " + unit["Finishing"]);

  const extraHtml = buildExtraDetailsHtml(unit);
  const resaleBoxHtml = buildResaleBoxHtml(unit);

  return `
    <div class="card">
      <div class="card-img" ${imgStyle}>
        ${images.length ? "" : "📷 لا توجد صورة"}
        ${images.length > 1 ? `<span class="card-badge">📷 ${images.length} صور</span>` : ""}
      </div>
      <div class="card-body">
        <div class="unit-top">
          <span class="status-badge ${statusClass}">${status}</span>
          <span class="unit-id">${unit["Unit ID"] || ""}</span>
        </div>
        <h3 class="card-title">${unit["Property Type"] || ""} - ${unit["Project Name"] || unit["City"] || ""}</h3>
        <p class="card-sub">📍 ${unit["City"] || ""}${unit["Area/District"] ? " - " + unit["Area/District"] : ""}</p>
        ${unit["Date Added"] ? `<p class="unit-added">🕒 أُضيفت في ${unit["Date Added"]}${unit["Last Updated"] ? " - آخر تحديث: " + unit["Last Updated"] : ""}</p>` : ""}
        <div class="card-specs">
          ${specs.map(s => `<span class="spec-chip">${s}</span>`).join("")}
        </div>
        ${resaleBoxHtml}
        <div class="unit-price-box">
          <div class="final-price">${formatPrice(unit["Price"])}</div>
          ${unit["Price per Meter"] ? `<div class="per-meter">${fmtNum(unit["Price per Meter"])} ج/م²</div>` : ""}
        </div>
        ${extraHtml ? `
        <button type="button" class="toggle-details-btn" onclick="toggleUnitDetails('${cardId}', this)">
          <span>عرض التفاصيل الكاملة</span><span class="chevron">▾</span>
        </button>
        <div class="unit-extra" id="${cardId}">${extraHtml}</div>
        ` : ""}
        <div class="card-footer">
          <div class="action-row">
            <a class="card-whatsapp" href="${buildWhatsappLink(unit)}" target="_blank" rel="noopener">💬 تواصل</a>
            <a class="icon-btn" href="${buildShareLink(unit)}" target="_blank" rel="noopener">📤 مشاركة</a>
            <button type="button" class="icon-btn" onclick="showSimilarUnits('${(unit["City"] || "").replace(/'/g, "\\'")}', '${(unit["Property Type"] || "").replace(/'/g, "\\'")}')">🔎 مشابه</button>
          </div>
          ${isAdminUnlocked() ? `
          <a class="edit-btn-row" href="${APPS_SCRIPT_URL}?page=entry&edit=${encodeURIComponent(unit["Unit ID"] || "")}" target="_blank" rel="noopener">
            ✏️ تعديل الوحدة
          </a>` : ""}
        </div>
      </div>
    </div>
  `;
}

function toggleUnitDetails(cardId, btn) {
  const el = document.getElementById(cardId);
  el.classList.toggle("open");
  btn.classList.toggle("open");
}

function renderLoading() {
  document.getElementById("content").innerHTML = `
    <div class="state-box">
      <div class="spinner"></div>
      <h3>جاري تحميل الوحدات...</h3>
    </div>`;
}

function renderError(msg) {
  document.getElementById("content").innerHTML = `
    <div class="state-box">
      <div class="icon">⚠️</div>
      <h3>حصل خطأ في تحميل البيانات</h3>
      <p>${msg}</p>
    </div>`;
}

function renderEmpty() {
  document.getElementById("content").innerHTML = `
    <div class="state-box">
      <div class="icon">🔍</div>
      <h3>مفيش وحدات مطابقة للبحث</h3>
      <p>جرب تغيّر الفلاتر أو تفضّيها كلها</p>
    </div>`;
}

function renderUnits(units) {
  document.getElementById("resultsCount").textContent = `${units.length} وحدة متاحة`;
  if (units.length === 0) { renderEmpty(); return; }
  document.getElementById("content").innerHTML =
    `<div class="grid">${units.map(unitCardHtml).join("")}</div>`;
}

function populateSelect(id, values) {
  const el = document.getElementById(id);
  const current = el.value;
  el.innerHTML = '<option value="">الكل</option>' + values.map(v => `<option value="${v}">${v}</option>`).join("");
  el.value = current;
}

async function loadFilterOptions() {
  try {
    const res = await fetch(APPS_SCRIPT_URL + "?action=filters");
    const data = await res.json();
    if (!data.success) return;
    allFilterOptions = data.options;
    populateSelect("fCity", allFilterOptions.cities || []);
    populateSelect("fDistrict", allFilterOptions.districts || []);
    populateSelect("fType", allFilterOptions.propertyTypes || []);
    populateSelect("fDeveloper", allFilterOptions.developers || []);
  } catch (err) {
    // فشل تحميل الفلاتر مش مشكلة كبيرة - البحث الأساسي يفضل شغال
    console.error("تعذر تحميل خيارات الفلاتر", err);
  }
}

async function loadUnits() {
  renderLoading();
  const params = new URLSearchParams({
    action: "list",
    city: document.getElementById("fCity").value,
    district: document.getElementById("fDistrict").value,
    propertyType: document.getElementById("fType").value,
    developer: document.getElementById("fDeveloper").value,
    minPrice: document.getElementById("fMinPrice").value,
    maxPrice: document.getElementById("fMaxPrice").value,
    keyword: document.getElementById("fKeyword").value
  });

  try {
    const res = await fetch(APPS_SCRIPT_URL + "?" + params.toString());
    const data = await res.json();
    if (!data.success) { renderError(data.message || "خطأ غير معروف"); return; }
    renderUnits(data.units || []);
  } catch (err) {
    renderError("تعذر الاتصال بالخادم. تأكد من الاتصال بالإنترنت وحاول تاني.");
    console.error(err);
  }
}

document.getElementById("applyFiltersBtn").addEventListener("click", loadUnits);
document.getElementById("resetFiltersBtn").addEventListener("click", function () {
  document.getElementById("fCity").value = "";
  document.getElementById("fDistrict").value = "";
  document.getElementById("fType").value = "";
  document.getElementById("fDeveloper").value = "";
  document.getElementById("fMinPrice").value = "";
  document.getElementById("fMaxPrice").value = "";
  document.getElementById("fKeyword").value = "";
  loadUnits();
});
document.getElementById("fKeyword").addEventListener("keydown", function (e) {
  if (e.key === "Enter") loadUnits();
});

/* ============================================================
 * وضع الأدمن (ظاهر ليك انت بس) - بيتفتح بـ PIN ويفضل محفوظ على
 * نفس الجهاز/المتصفح لحد ما تقفله بنفسك من نفس الزرار
 * ============================================================ */
const ADMIN_FLAG_KEY = "resaleAdminUnlocked";

function isAdminUnlocked() {
  try { return localStorage.getItem(ADMIN_FLAG_KEY) === "1"; } catch (e) { return false; }
}

async function toggleAdminMode() {
  if (isAdminUnlocked()) {
    try { localStorage.removeItem(ADMIN_FLAG_KEY); } catch (e) {}
    alert("تم قفل وضع الأدمن");
    loadUnits();
    return;
  }

  const pin = prompt("ادخل PIN الأدمن:");
  if (!pin) return;

  try {
    const res = await fetch(APPS_SCRIPT_URL + "?action=verifyPin&pin=" + encodeURIComponent(pin));
    const data = await res.json();
    if (data.success) {
      try { localStorage.setItem(ADMIN_FLAG_KEY, "1"); } catch (e) {}
      alert("تم فتح وضع الأدمن ✅ زرار التعديل هيظهر على كل الوحدات");
      loadUnits();
    } else {
      alert("PIN غلط");
    }
  } catch (err) {
    alert("تعذر التحقق من الـ PIN، تأكد من الاتصال بالإنترنت");
  }
}

document.getElementById("adminLockBtn").addEventListener("click", toggleAdminMode);

/* ============================================================
 * عداد الزوار - بيتسجل مرة واحدة بس لكل جهاز، وبيتحدّث الرقم
 * لحظيًا لكل زوار الموقع كل 20 ثانية
 * ============================================================ */
const VISITOR_FLAG_KEY = "resaleVisitorCounted";

async function initVisitorCounter() {
  let alreadyCounted = false;
  try { alreadyCounted = localStorage.getItem(VISITOR_FLAG_KEY) === "1"; } catch (e) {}

  try {
    if (!alreadyCounted) {
      const res = await fetch(APPS_SCRIPT_URL + "?action=visit");
      const data = await res.json();
      if (data.success) {
        document.getElementById("visitorCount").textContent = fmtNum(data.count);
        try { localStorage.setItem(VISITOR_FLAG_KEY, "1"); } catch (e) {}
      }
    } else {
      refreshVisitorCount();
    }
  } catch (err) {
    console.error("تعذر تسجيل الزيارة", err);
  }

  // تحديث الرقم كل 20 ثانية عشان يبان "لايف" لكل زوار الموقع
  setInterval(refreshVisitorCount, 20000);
}

async function refreshVisitorCount() {
  try {
    const res = await fetch(APPS_SCRIPT_URL + "?action=visitorCount");
    const data = await res.json();
    if (data.success) document.getElementById("visitorCount").textContent = fmtNum(data.count);
  } catch (err) {
    // فشل التحديث الدوري مش مشكلة كبيرة، هيحاول تاني بعد 20 ثانية
  }
}

setHeaderWhatsapp();
loadFilterOptions();
loadUnits();
initVisitorCounter();
</script>
</body>
</html>
