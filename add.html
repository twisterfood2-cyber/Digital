<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A1C2F">
  <title>إدخال وحدة — تحويل</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A1C2F'/%3E%3Ctext x='50' y='68' font-family='Arial, sans-serif' font-size='55' font-weight='900' fill='%23C99A2E' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
  <!--
    المرحلة 3.3 — توحيد مدخل إضافة الوحدات.
    شاشة إدخال الوحدة الأساسية بقت داخل شاشة البحث (index.html) عبر زر "إدخال وحدة".
    الملف ده اتحوّل لمسار توافقي (Legacy Compatibility Route) للـ bookmarks القديمة فقط:
      add.html  →  index.html#add  →  نفس نموذج الإضافة الأساسي (openAddUnitModal / #editModal)
    مافيش هنا: نموذج، ولا منطق حفظ، ولا نداء ADD_UNIT، ولا مصادقة — كل ده بيحصل في الوجهة.
    الوجهة بتمرّ بنفس بوابة الصلاحيات الموجودة (unlockAddThen → ADD_UNIT / verifyDataEntryPin).
  -->
  <!-- بديل بدون جافاسكربت: تحويل فوري -->
  <meta http-equiv="refresh" content="0; url=index.html#add">
  <style>
    html, body { margin: 0; height: 100%; background: #0A1C2F; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
      color: #E6C978; text-align: center; padding: 24px;
    }
    .box { max-width: 360px; }
    .spin {
      width: 34px; height: 34px; margin: 0 auto 16px;
      border: 3px solid rgba(230,201,120,0.25); border-top-color: #C99A2E;
      border-radius: 50%; animation: r 0.8s linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
    p { font-size: 14px; line-height: 1.9; margin: 0 0 14px; font-weight: 700; }
    a { color: #C99A2E; font-weight: 800; font-size: 13px; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <p>جارٍ تحويلك إلى شاشة البحث لإضافة وحدة…</p>
    <a id="fallbackLink" href="index.html#add">اضغط هنا لو التحويل ما اشتغلش تلقائيًا</a>
  </div>
  <script>
    (function () {
      // الوجهة الافتراضية: شقيقة نفس المجلد (استضافة ثابتة).
      var target = 'index.html#add';
      try {
        // شبكة أمان: لو الصفحة اتقدّمت من Apps Script (/macros/s/.../exec) — روح لمسار البحث هناك.
        var p = String(window.location.pathname || '');
        if (p.indexOf('/macros/s/') !== -1 || /(^|[?&])page=/.test(String(window.location.search || ''))) {
          target = window.location.pathname + '?page=search#add';
        }
      } catch (e) {}
      var link = document.getElementById('fallbackLink');
      if (link) link.setAttribute('href', target);
      // replace() — عشان مانسيبش صفحة التحويل في تاريخ المتصفح (زر رجوع ما يرجّعش لهنا).
      window.location.replace(target);
    })();
  </script>
</body>
</html>
